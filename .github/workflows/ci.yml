name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (check only, no autofix)
        run: npx eslint .

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --run

      - name: Production build
        run: npm run build

  backend:
    name: Backend (install, import & app smoke check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: App import & smoke check (no database required)
        env:
          DATABASE_URL: postgresql://postgres:***@localhost:5432/inventory_db
          SECRET_KEY: ci-smoke-secret
        run: python scripts/smoke_check.py

  compose-config:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create env files from templates (CI placeholders)
        run: |
          printf 'POSTGRES_PASSWORD=ci-placeholder\n' > .env
          printf 'DATABASE_URL=postgresql://postgres:***@db:5432/inventory_db\nSECRET_KEY=ci-placeholder\nUSERNAME_SEED=ciuser\nPASSWORD_SEED=CiPlaceholder123!\n' > backend/.env
          cp tests/performance/k6/.env.example tests/performance/k6/.env

      - name: Validate compose file
        run: docker compose config -q

  integration-k6:
    name: Integration (compose stack + k6 smoke)
    runs-on: ubuntu-latest
    needs: [frontend, backend, compose-config]
    steps:
      - uses: actions/checkout@v4

      - name: Create env files (CI demo credentials)
        run: |
          printf 'POSTGRES_PASSWORD=ci-placeholder\n' > .env
          printf 'DATABASE_URL=postgresql://postgres:***@db:5432/inventory_db\nSECRET_KEY=ci-placeholder\nUSERNAME_SEED=ciuser\nPASSWORD_SEED=CiPlaceholder123!\n' > backend/.env
          printf 'API_BASE_URL=http://gateway/api/v1\nK6_USERNAME=ciuser\nK6_PASSWORD=CiPlaceholder123!\n' > tests/performance/k6/.env

      - name: Build and start the stack
        run: docker compose up -d --build db backend frontend gateway

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become ready in time"
          docker compose logs backend
          exit 1

      - name: Run k6 smoke test
        run: docker compose --profile performance run --rm k6 run smoke.js

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
